<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share feedback — FeedbackHub</title><link rel="stylesheet" href="assets/styles.css"></head><body><header class="wrap nav"><a class="brand" href="index.html">◈ <span>Feedback</span>Hub</a><div id="navUser" class="navlinks"></div></header><main class="wrap auth"><div class="authbox" style="width:min(680px,100%)"><span class="eyebrow">STUDENT VOICE</span><h1>Share feedback</h1><p class="muted">Be specific. Your feedback helps identify what is working and where action is needed.</p><div id="alert" class="alert"></div><form id="form"><div class="field"><label>Category</label><select name="category"><option>Teaching & Faculty</option><option>Infrastructure</option><option>Labs & Technology</option><option>Examinations</option><option>Library</option><option>Hostel</option><option>Transport</option><option>Events & Activities</option><option>Campus</option><option>Other</option></select></div><div class="field"><label>Short title</label><input name="title" maxlength="180" required placeholder="e.g. Lab systems need faster startup"></div><div class="field"><label>Experience rating</label><div class="stars"><button type="button" class="star" data-v="1">★</button><button type="button" class="star" data-v="2">★</button><button type="button" class="star" data-v="3">★</button><button type="button" class="star" data-v="4">★</button><button type="button" class="star" data-v="5">★</button></div><input type="hidden" name="rating" id="rating" value="0"></div><div class="field"><label>Detailed feedback</label><textarea name="message" maxlength="2000" required placeholder="What happened? What would a better experience look like?"></textarea></div><label class="check"><input type="checkbox" name="anonymous" value="true"> Submit anonymously to the standard admin view</label><button class="btn primary" style="width:100%;margin-top:18px">Submit feedback →</button></form></div></main><script src="assets/app.js"></script><script>(async()=>{const s=await session();if(s.authenticated){const note=document.createElement('div');note.className='badge';note.textContent='Signed in — your feedback can appear in My Dashboard';document.querySelector('.authbox').insertBefore(note,document.querySelector('.authbox h1'));}})();let rating=0;$$('.star').forEach(b=>b.onclick=()=>{rating=+b.dataset.v;$('#rating').value=rating;$$('.star').forEach(x=>x.classList.toggle('active',+x.dataset.v<=rating))});$('#form').onsubmit=async e=>{e.preventDefault();if(!rating){$('#alert').textContent='Please choose a rating from 1 to 5.';$('#alert').style.display='block';return}try{const d=Object.fromEntries(new FormData(e.target));await api('api/feedback',{method:'POST',body:new URLSearchParams(d)});location.href='success.html'}catch(x){$('#alert').textContent=x.message;$('#alert').style.display='block'}};</script></body></html>
