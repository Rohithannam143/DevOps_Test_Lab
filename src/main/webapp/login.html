<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — FeedbackHub</title><link rel="stylesheet" href="assets/styles.css"></head><body><header class="wrap nav"><a class="brand" href="index.html">◈ <span>Feedback</span>Hub</a><div class="navlinks"><a href="register.html">Create account</a></div></header><main class="wrap auth"><div class="authbox"><span class="eyebrow">WELCOME BACK</span><h1>Sign in</h1><p class="muted">Access your feedback workspace.</p><div id="alert" class="alert"></div><form id="form"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required placeholder="you@college.edu"></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required placeholder="••••••••"></div><button class="btn primary" style="width:100%">Sign in →</button></form><p class="muted" style="font-size:12px;margin-top:18px">Demo admin: <b>admin@feedbackhub.local</b> / <b>Admin@123</b></p><p class="muted" style="font-size:12px">New student? <a href="register.html" style="color:#4f46e5;font-weight:800">Create an account</a></p></div></main><script src="assets/app.js"></script><script>$('#form').onsubmit=async e=>{e.preventDefault();$('#alert').style.display='none';try{const d=Object.fromEntries(new FormData(e.target));const r=await api('api/auth/login',{method:'POST',body:new URLSearchParams(d)});location.href=r.role==='ADMIN'?'admin.html':'dashboard.html'}catch(x){$('#alert').textContent=x.message;$('#alert').style.display='block'}};</script></body></html>
