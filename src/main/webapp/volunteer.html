<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volunteer — FeedbackHub</title><link rel="stylesheet" href="assets/styles.css"></head><body><header class="wrap nav"><a class="brand" href="index.html">◈ <span>Feedback</span>Hub</a><div class="navlinks"><a href="feedback.html">Give Feedback</a><a class="btn ghost" href="index.html">Home</a></div></header><main class="wrap auth"><div class="authbox" style="width:min(760px,100%)"><span class="eyebrow">COMMUNITY VOLUNTEER</span><h1>Join as a volunteer.</h1><p class="muted">No account is required. Tell us who you are, what you study and how you would like to contribute.</p><div id="alert" class="alert"></div><form id="volForm"><div class="row"><div class="field"><label>First name *</label><input name="name" required maxlength="120" placeholder="Rohith"></div><div class="field"><label>Surname *</label><input name="surname" required maxlength="120" placeholder="Annam"></div></div><div class="row"><div class="field"><label>Mobile number *</label><input name="mobile" required maxlength="30" inputmode="tel" placeholder="9876543210"></div><div class="field"><label>Email ID *</label><input name="email" required type="email" maxlength="180" placeholder="you@example.com"></div></div><div class="row"><div class="field"><label>Gender</label><select name="gender"><option value="">Prefer not to say</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>Studying about *</label><input name="studying_about" required maxlength="180" placeholder="B.Tech CSE — 3rd Year"></div></div><div class="field"><label>What would you like to volunteer for? *</label><textarea name="description" required maxlength="2000" placeholder="Tell us about your interests, experience and how you can help."></textarea></div><div class="row"><div class="field"><label>Availability</label><select name="availability"><option>Weekends</option><option>Evenings</option><option>Weekday mornings</option><option>Weekday afternoons</option><option>Flexible</option></select></div><div class="field"><label>Skills / interests</label><input name="skills" maxlength="500" placeholder="Design, events, coding, outreach..."></div></div><button class="btn primary" style="width:100%;margin-top:8px">Submit volunteer application →</button></form><p class="muted" style="font-size:11px;margin-top:14px">Your details are collected for volunteer coordination and can be reviewed by authorized administrators.</p></div></main><script src="assets/app.js"></script><script>$('#volForm').onsubmit=async e=>{e.preventDefault();$('#alert').style.display='none';try{const d=Object.fromEntries(new FormData(e.target));const r=await api('api/volunteer',{method:'POST',body:new URLSearchParams(d)});location.href='success.html?type=volunteer&id='+encodeURIComponent(r.id)}catch(x){$('#alert').textContent=x.message;$('#alert').style.display='block'}};</script></body></html>
