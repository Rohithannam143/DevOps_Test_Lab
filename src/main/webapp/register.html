<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — FeedbackHub</title><link rel="stylesheet" href="assets/styles.css"></head><body><header class="wrap nav"><a class="brand" href="index.html">◈ <span>Feedback</span>Hub</a><div class="navlinks"><a href="login.html">Sign in</a></div></header><main class="wrap auth"><div class="authbox"><span class="eyebrow">STUDENT ACCOUNT</span><h1>Create your account</h1><p class="muted">One account for submitting and tracking feedback.</p><div id="alert" class="alert"></div><form id="form"><div class="row"><div class="field"><label>Full name</label><input name="name" required placeholder="Your name"></div><div class="field"><label>Year</label><select name="year"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option><option>Postgraduate</option></select></div></div><div class="field"><label>Email</label><input name="email" type="email" required placeholder="you@college.edu"></div><div class="field"><label>Department</label><input name="department" placeholder="Computer Science & Engineering"></div><div class="field"><label>Password</label><input name="password" type="password" minlength="8" required placeholder="Minimum 8 characters"></div><button class="btn primary" style="width:100%">Create account →</button></form></div></main><script src="assets/app.js"></script><script>$('#form').onsubmit=async e=>{e.preventDefault();$('#alert').style.display='none';try{const r=await api('api/auth/register',{method:'POST',body:new URLSearchParams(Object.fromEntries(new FormData(e.target)))});location.href='dashboard.html'}catch(x){$('#alert').textContent=x.message;$('#alert').style.display='block'}};</script></body></html>
